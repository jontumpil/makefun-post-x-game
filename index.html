<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Catcher — one prompt, one game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1026; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: min(100vw, 56.25vh); aspect-ratio: 9 / 16; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 18px;
           box-shadow: 0 0 60px rgba(255, 45, 120, .35); touch-action: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
          color: rgba(255,255,255,.55); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hint">← → / A D / drag to move &nbsp;•&nbsp; P pause &nbsp;•&nbsp; R restart</div>
</div>
<script>
"use strict";
/* Star Catcher — built from a single prompt.
   Catch the falling stars, dodge the bombs, keep your three lives. */

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = 540, H = 960;

// --- game state ------------------------------------------------------------
let score = 0, lives = 3, level = 1, over = false, started = false, paused = false;
let basketX = W / 2;                 // centre of the basket
let items = [];                      // falling things: {x, y, vy, kind, r, spin}
let spawnIn = 0;                     // frames until the next spawn
let frame = 0;
let twinkles = [];                   // background stars

for (let i = 0; i < 70; i++) {
  twinkles.push({ x: Math.random() * W, y: Math.random() * H * 0.7,
                  r: Math.random() * 1.8 + 0.6, p: Math.random() * Math.PI * 2 });
}

function rand(a, b) { return a + Math.random() * (b - a); }

function spawn() {
  const roll = Math.random();
  const kind = roll < 0.16 ? "bomb" : roll < 0.30 ? "pink" : "star";
  items.push({
    x: rand(40, W - 40),
    y: -30,
    vy: rand(2.6, 3.6) + level * 0.35,
    kind: kind,
    r: kind === "bomb" ? 20 : 17,
    spin: rand(-0.06, 0.06),
    rot: 0
  });
}

function reset() {
  score = 0; lives = 3; level = 1; over = false; started = true; paused = false;
  items = []; spawnIn = 20; frame = 0; basketX = W / 2;
}

function loseLife() {
  lives -= 1;
  if (lives <= 0) { lives = 0; over = true; }
}

// --- input -----------------------------------------------------------------
const keys = {};
addEventListener("keydown", (e) => {
  keys[e.key] = true;
  if ((e.key === "r" || e.key === "R") && over) reset();
  if ((e.key === " " || e.key === "Enter") && !started) reset();
  if ((e.key === "p" || e.key === "P") && started && !over) paused = !paused;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
});
addEventListener("keyup", (e) => { keys[e.key] = false; });

function pointerToX(e) {
  const rect = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return cx / rect.width * W;
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { reset(); return; }
  if (!started) { reset(); return; }
  basketX = pointerToX(e);
});
cv.addEventListener("pointermove", (e) => {
  if (e.buttons) basketX = pointerToX(e);
});

// --- update ----------------------------------------------------------------
function update() {
  frame++;
  if (!started || over || paused) return;

  const speed = 9;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) basketX -= speed;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) basketX += speed;
  basketX = Math.max(62, Math.min(W - 62, basketX));

  spawnIn--;
  if (spawnIn <= 0) { spawn(); spawnIn = Math.max(18, 52 - level * 4); }

  const basketY = H - 110;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy;
    it.rot += it.spin;
    if (it.y > H + 40) { items.splice(i, 1); continue; }
    const caught = Math.abs(it.x - basketX) < 62 && Math.abs(it.y - basketY) < 46;
    if (caught) {
      if (it.kind === "bomb") { loseLife(); }
      else if (it.kind === "pink") { score += 25; }
      else { score += 10; }
      items.splice(i, 1);
    }
  }
  level = 1 + Math.floor(score / 150);
}

// --- drawing ---------------------------------------------------------------
function drawStar(x, y, r, rot, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = i * Math.PI / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBomb(x, y, r) {
  ctx.fillStyle = "#22242e";
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#8a8fa3"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, r - 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#ffcf3f";
  ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ff5a5a";
  ctx.font = "bold 22px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("!", x, y + 1);
}

function drawBasket() {
  const y = H - 110;
  ctx.fillStyle = "#ff2d78";
  ctx.beginPath();
  ctx.moveTo(basketX - 62, y - 18);
  ctx.lineTo(basketX + 62, y - 18);
  ctx.lineTo(basketX + 48, y + 26);
  ctx.lineTo(basketX - 48, y + 26);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ff7ab0";
  ctx.fillRect(basketX - 62, y - 24, 124, 8);
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.fillRect(basketX - 40, y - 6, 10, 26);
  ctx.fillRect(basketX - 5, y - 6, 10, 26);
  ctx.fillRect(basketX + 30, y - 6, 10, 26);
}

function draw() {
  // night sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0b1026");
  sky.addColorStop(0.6, "#1b1145");
  sky.addColorStop(1, "#3a0f4d");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // twinkling background stars
  for (const t of twinkles) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(frame / 40 + t.p));
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ground glow
  ctx.fillStyle = "rgba(255,45,120,.12)";
  ctx.fillRect(0, H - 70, W, 70);

  // HUD
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 34px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("SCORE  " + score, 24, 26);
  ctx.font = "bold 24px system-ui, sans-serif";
  ctx.fillStyle = "#ffd23f";
  ctx.fillText("LEVEL " + level, 24, 72);
  ctx.textAlign = "right";
  ctx.font = "bold 30px system-ui, sans-serif";
  ctx.fillStyle = "#ff5a7a";
  ctx.fillText("♥".repeat(lives) + "♡".repeat(3 - lives), W - 24, 26);

  // falling items
  for (const it of items) {
    if (it.kind === "bomb") drawBomb(it.x, it.y, it.r);
    else if (it.kind === "pink") drawStar(it.x, it.y, it.r, it.rot, "#ff8ad8");
    else drawStar(it.x, it.y, it.r, it.rot, "#ffd23f");
  }

  drawBasket();

  if (!started) {
    ctx.fillStyle = "rgba(5,8,20,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.font = "bold 64px system-ui, sans-serif";
    ctx.fillText("STAR", W / 2, H / 2 - 120);
    ctx.fillStyle = "#ffd23f";
    ctx.fillText("CATCHER", W / 2, H / 2 - 50);
    ctx.fillStyle = "#c9cbe0";
    ctx.font = "26px system-ui, sans-serif";
    ctx.fillText("Catch the stars. Dodge the bombs.", W / 2, H / 2 + 40);
    ctx.fillText("You get three lives. Good luck!", W / 2, H / 2 + 78);
    ctx.fillStyle = "#ff2d78";
    ctx.font = "bold 30px system-ui, sans-serif";
    ctx.fillText("TAP OR PRESS SPACE TO PLAY", W / 2, H / 2 + 160);
  }

  if (over) {
    ctx.fillStyle = "rgba(5,8,20,.78)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ff5a7a";
    ctx.textAlign = "center";
    ctx.font = "bold 58px system-ui, sans-serif";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 90);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 40px system-ui, sans-serif";
    ctx.fillText("SCORE  " + score, W / 2, H / 2 - 10);
    ctx.fillStyle = "#c9cbe0";
    ctx.font = "26px system-ui, sans-serif";
    ctx.fillText("Press R or tap to play again", W / 2, H / 2 + 60);
  }

  if (paused && !over) {
    ctx.fillStyle = "rgba(5,8,20,.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.font = "bold 54px system-ui, sans-serif";
    ctx.fillText("PAUSED", W / 2, H / 2 - 20);
    ctx.fillStyle = "#c9cbe0";
    ctx.font = "26px system-ui, sans-serif";
    ctx.fillText("Press P to keep playing", W / 2, H / 2 + 40);
  }
}

// --- main loop -------------------------------------------------------------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
